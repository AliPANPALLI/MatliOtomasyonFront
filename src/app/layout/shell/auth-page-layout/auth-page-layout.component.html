<div class="relative p-6 bg-white bg-honeycomb z-1 dark:bg-gray-900 sm:p-0">
  <div
    class="relative flex flex-col justify-center w-full h-screen lg:flex-row sm:p-0"
  >
    <ng-content></ng-content>

    <!-- Sağ panel -->
    <div
      class="relative hidden h-full w-full overflow-hidden lg:flex lg:w-1/2 flex-col gap-6 px-10 py-8 xl:px-14 matli-fg bg-matli-gradient"
    >
      <!-- Petek deseni -->
      <div class="pointer-events-none absolute inset-0 bg-honeycomb-adaptive"></div>

      <!-- Dekoratif altıgenler -->
      <div class="pointer-events-none absolute -top-10 right-16 h-40 w-36 clip-hex bg-brand-500/10 dark:bg-white/10"></div>
      <div class="pointer-events-none absolute top-24 right-4 h-20 w-[72px] clip-hex bg-brand-300/25"></div>
      <div class="pointer-events-none absolute bottom-32 -left-10 h-48 w-[166px] clip-hex bg-brand-400/20"></div>
      <div class="pointer-events-none absolute bottom-10 right-24 h-16 w-14 clip-hex bg-brand-500/10 dark:bg-white/10"></div>
      <div class="pointer-events-none absolute -bottom-40 -right-24 h-96 w-96 rounded-full bg-brand-300/20 blur-3xl"></div>

      <!-- Üst: başlık -->
      <div class="relative z-1">
        <h2 class="text-3xl font-semibold leading-tight xl:text-4xl">
          {{ 'auth.headline1' | t }}<br />{{ 'auth.headline2' | t }}
        </h2>
        <p class="mt-3 max-w-md matli-fg-muted">
          {{ 'auth.description' | t }}
        </p>
      </div>

      <!-- Orta: video — kutusuz, kenarları zemine yumuşakça karışır -->
      <div class="relative z-1 -mx-10 xl:-mx-14 flex min-h-0 flex-1 items-center justify-center">
          <video
            class="video-fade block max-h-full max-w-full"
            src="/videos/matliOtomasyonIntro.mp4"
            autoplay
            muted
            [muted]="true"
            loop
            playsinline
            preload="auto"
            [attr.aria-label]="'auth.videoLabel' | t"
          ></video>
      </div>

      <!-- Alt: şirketler kayan logo bandı -->
      <div class="relative z-1 shrink-0">
        <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] matli-fg">
          {{ 'auth.companies' | t }}
        </p>
        <div class="marquee-mask overflow-hidden py-1">
          <div class="marquee-track flex w-max gap-4">
            @for (logo of marqueeLogos; track $index) {
              <div class="flex h-20 w-40 shrink-0 items-center justify-center px-2 py-2">
                <img
                  class="max-h-full max-w-full object-contain"
                  [src]="'/images/matli/' + logo.logo"
                  [alt]="logo.name"
                  loading="lazy"
                />
              </div>
            }
          </div>
        </div>
      </div>
    </div>

    <!-- Sağ üst: dil seçici + tema -->
    <div class="fixed z-50 top-4 ltr:right-4 rtl:left-4 flex items-center gap-2 sm:top-6 sm:ltr:right-6 sm:rtl:left-6">
      <app-language-switcher />
      <div class="hidden sm:block">
        <app-theme-toggle-two />
      </div>
    </div>
  </div>
</div>
