<div class="relative min-h-screen bg-gray-50 bg-honeycomb dark:bg-gray-900">
  <!-- Üst bar -->
  <header class="mx-auto flex w-full max-w-6xl items-center justify-between gap-4 px-4 py-5 sm:px-6">
    <img
      class="h-10 w-auto sm:h-12"
      src="/images/logo/matli-otomasyon-logo.png"
      alt="Matlı Otomasyon"
      width="178"
      height="48"
    />
    <div class="flex items-center gap-2">
      <app-language-switcher />
      <div class="hidden sm:block">
        <app-theme-toggle-two />
      </div>
    </div>
  </header>

  <main class="mx-auto w-full max-w-6xl px-4 pb-12 sm:px-6">
    <!-- Başlık bandı: giriş sayfasındaki mavi + petek tasarımı -->
    <section
      class="relative overflow-hidden rounded-3xl px-6 py-8 matli-fg shadow-theme-lg sm:px-10 sm:py-10 bg-matli-gradient"
    >
      <div class="pointer-events-none absolute inset-0 bg-honeycomb-adaptive"></div>
      <div class="pointer-events-none absolute -top-8 right-10 h-32 w-28 clip-hex bg-brand-500/10 dark:bg-white/10"></div>
      <div class="pointer-events-none absolute bottom-4 right-44 h-14 w-12 clip-hex bg-brand-300/25"></div>

      <div class="relative z-1 flex flex-col gap-6 lg:flex-row lg:items-end lg:justify-between">
        <div>
          <h1 class="text-2xl font-semibold sm:text-3xl">{{ 'company.title' | t }}</h1>
          <p class="mt-2 max-w-xl matli-fg-muted">{{ 'company.subtitle' | t }}</p>
        </div>

        <!-- Arama -->
        <label class="relative block w-full lg:w-80">
          <span class="sr-only">{{ 'company.search' | t }}</span>
          <svg
            class="pointer-events-none absolute top-1/2 ltr:left-4 rtl:right-4 size-5 -translate-y-1/2 text-gray-400"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <input
            type="search"
            [value]="query()"
            (input)="onSearch($event)"
            [placeholder]="'company.search' | t"
            class="h-11 w-full rounded-[10px] border border-brand-200 bg-white py-2.5 ltr:pl-12 ltr:pr-4 rtl:pr-12 rtl:pl-4 text-sm text-gray-800 shadow-theme-xs outline-hidden placeholder:text-gray-400 focus:ring-3 focus:ring-white/30 dark:bg-gray-900 dark:text-white/90 dark:border-gray-700"
          />
        </label>
      </div>
    </section>

    <!-- Şirket kartları -->
    @if (filtered().length) {
      <ul class="mt-8 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 sm:gap-5">
        @for (company of filtered(); track company.id) {
          @let isSelected = companyService.selectedId() === company.id;
          <li>
            <button
              type="button"
              (click)="select(company)"
              class="group relative flex h-full w-full flex-col items-center gap-4 rounded-2xl border bg-white p-6 text-center transition-all duration-200 hover:-translate-y-0.5 hover:border-brand-300 hover:shadow-theme-lg focus-visible:outline-hidden focus-visible:ring-3 focus-visible:ring-brand-500/30 dark:bg-white/[0.03] dark:hover:border-brand-500/50"
              [class]="isSelected ? 'border-brand-500 ring-2 ring-brand-500/20' : 'border-gray-200 dark:border-gray-800'"
            >
              @if (isSelected) {
                <span class="absolute top-3 ltr:right-3 rtl:left-3 rounded-full bg-brand-50 px-2.5 py-0.5 text-xs font-medium text-brand-600 dark:bg-brand-500/15 dark:text-brand-400">
                  {{ 'company.lastSelected' | t }}
                </span>
              }

              <!-- Logo alanı (logolar orijinal renkleriyle gösterilir) -->
              <div class="flex h-24 w-full items-center justify-center rounded-xl dark:bg-brand-100 dark:p-3">
                <img
                  class="max-h-full max-w-[85%] object-contain transition-transform duration-200 group-hover:scale-105"
                  [src]="'/images/matli/' + company.logo"
                  [alt]="company.name"
                  loading="lazy"
                />
              </div>

              <div class="flex w-full items-center justify-between gap-2 border-t border-gray-100 pt-4 dark:border-gray-800">
                <span class="truncate text-sm font-medium text-gray-800 dark:text-white/90">{{ company.name }}</span>
                <span
                  class="flex size-8 shrink-0 items-center justify-center rounded-full bg-gray-100 text-gray-500 transition-colors group-hover:bg-brand-500 group-hover:text-white dark:bg-white/5 dark:text-gray-400"
                  aria-hidden="true"
                >
                  <svg class="size-4 rtl:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M13 6l6 6-6 6" />
                  </svg>
                </span>
              </div>
            </button>
          </li>
        }
      </ul>
    } @else {
      <div class="mt-8 rounded-2xl border border-dashed border-gray-300 bg-white p-10 text-center dark:border-gray-700 dark:bg-white/[0.03]">
        <p class="text-gray-600 dark:text-gray-400">{{ 'company.noResults' | t }}</p>
      </div>
    }

    <!-- Alt: çıkış -->
    <div class="mt-10 flex justify-center">
      <button
        type="button"
        (click)="signOut()"
        class="inline-flex items-center gap-2 rounded-lg px-4 py-2 text-sm font-medium text-gray-500 transition-colors hover:bg-gray-100 hover:text-gray-700 dark:text-gray-400 dark:hover:bg-white/5 dark:hover:text-gray-300"
      >
        <svg class="size-5 rtl:rotate-180" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h7.75M8 8l-3.998 4 3.997 4M9.75 4.996V4.25a1.5 1.5 0 011.5-1.5h6a1.5 1.5 0 011.5 1.5v15.5a1.5 1.5 0 01-1.5 1.5h-6a1.5 1.5 0 01-1.5-1.5V19" />
        </svg>
        {{ 'company.signOut' | t }}
      </button>
    </div>
  </main>
</div>
