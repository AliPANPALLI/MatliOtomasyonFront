<div>

    <div class="space-y-6">
      <app-default-inputs />
      <app-select-inputs />
      <app-textarea-input />
      <app-input-states />
    </div>
    <div class="space-y-6">
      <app-input-group />
      <app-file-input />
      <app-checkbox-inputs />
      <app-radio-buttons />
